<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="16" fill="url(#grad)"/>

  <!-- Neural network — nodes -->
  <circle cx="32" cy="14" r="3"   fill="white" opacity="0.9"/>
  <circle cx="14" cy="34" r="3"   fill="white" opacity="0.9"/>
  <circle cx="50" cy="34" r="3"   fill="white" opacity="0.9"/>
  <circle cx="22" cy="52" r="2.5" fill="white" opacity="0.8"/>
  <circle cx="42" cy="52" r="2.5" fill="white" opacity="0.8"/>
  <!-- Center node -->
  <circle cx="32" cy="32" r="4.5" fill="white"/>

  <!-- Connections from center -->
  <line x1="32" y1="27.5" x2="32" y2="17"   stroke="white" stroke-width="1.5" opacity="0.65"/>
  <line x1="28"  y1="30"  x2="17" y2="34"   stroke="white" stroke-width="1.5" opacity="0.65"/>
  <line x1="36"  y1="30"  x2="47" y2="34"   stroke="white" stroke-width="1.5" opacity="0.65"/>
  <line x1="29"  y1="35"  x2="24" y2="49.5" stroke="white" stroke-width="1.5" opacity="0.65"/>
  <line x1="35"  y1="35"  x2="40" y2="49.5" stroke="white" stroke-width="1.5" opacity="0.65"/>

  <!-- Outer connections -->
  <line x1="32" y1="14" x2="50" y2="34"   stroke="white" stroke-width="1"   opacity="0.3"/>
  <line x1="32" y1="14" x2="14" y2="34"   stroke="white" stroke-width="1"   opacity="0.3"/>
  <line x1="14" y1="34" x2="22" y2="52"   stroke="white" stroke-width="1"   opacity="0.3"/>
  <line x1="50" y1="34" x2="42" y2="52"   stroke="white" stroke-width="1"   opacity="0.3"/>
  <line x1="22" y1="52" x2="42" y2="52"   stroke="white" stroke-width="1"   opacity="0.2"/>
</svg>
